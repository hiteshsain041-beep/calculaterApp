<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header">
           
            
            <h2>Calculator</h2>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Simple Interest</a></li>
            <li><a href="bmi.html" class="ActiveLink">Body Mass Index</a></li>
            <li><a href="calorie.html">Calorie</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h1>Body Mass Index Calculator</h1>

            <form oninput="BodyMassIndex()">
                <label for="Height">Height (cm)</label>
                <input type="number" name="Height" id="Height" placeholder="Enter Height" min="0" step="any">

                <label for="Weight">Weight (kg)</label>
                <input type="number" name="Weight" id="Weight" placeholder="Enter Weight" min="0" step="any">
            </form>

            <div class="result">
                <div style="margin-bottom: 10px;">BMI: <span id="BMI" class="BMI">0.00</span></div>
                <div style="margin-bottom: 10px;">Category: <span id="BMICategory" class="BMICategory"></span></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
